<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>知乎评论（固定页面）</title>
    <style>
      .CommentItem { margin-left: 0; }
      .CommentItem .CommentItem { margin-left: 32px; } /* 回复是嵌在父评论里面的 */
    </style>
  </head>
  <body>
    <!--
      模拟真实知乎：
      1) 评论默认不渲染，只有一个入口按钮；
      2) 入口文字是 "​ 61 条评论"——前面那个零宽字符 U+200B 是真实页面上抓到的；
      3) 点开之后才出现 6 条评论（4 条别人的 + 2 条作者的回复，嵌套在父评论里）。
    -->
    <button id="openComments">&#8203; 61 条评论</button>
    <div id="commentHost"></div>

    <pre id="out">pending</pre>

    <script>
      const COMMENT_HTML = [
        '<div class="CommentListV2">',
        '  <div class="CommentItem">',
        '    <div class="CommentItem-head">',
        '      <a href="/people/lurenjia"><img class="Avatar" src="https://picx.zhimg.com/avatar-a.jpg" alt="路人甲" /></a>',
        '      <a href="/people/lurenjia">路人甲</a>',
        '      <button>3</button>',
        '      <button>回复</button>',
        '    </div>',
        '    <div class="CommentContent">路人甲说的话：这办法对中年人也管用吗？</div>',
        '  </div>',
        '  <div class="CommentItem">',
        '    <div class="CommentItem-head">',
        '      <a href="/people/lurenyi"><img class="Avatar" src="https://picx.zhimg.com/avatar-b.jpg" alt="路人乙" /></a>',
        '      <a href="/people/lurenyi">路人乙</a>',
        '      <button>回复</button>',
        '    </div>',
        '    <div class="CommentContent">路人乙说的话：约饭那一段我不太同意。</div>',
        '    <div class="CommentItem">',
        '      <div class="CommentItem-head">',
        '        <a href="/people/yiwangtong"><img class="Avatar" src="https://picx.zhimg.com/avatar-author.jpg" alt="一望瞳" /></a>',
        '        <a href="/people/yiwangtong">一望瞳</a>',
        '        <span>作者</span>',
        '        <button>回复</button>',
        '      </div>',
        '      <div class="CommentContent">回复 @路人乙：约饭只是最低成本的一次筛选。</div>',
        '    </div>',
        '  </div>',
        '  <div class="CommentItem">',
        '    <div class="CommentItem-head">',
        '      <a href="/people/lurenbing"><img class="Avatar" src="https://picx.zhimg.com/avatar-c.jpg" alt="路人丙" /></a>',
        '      <a href="/people/lurenbing">路人丙</a>',
        '      <button>12</button>',
        '      <button>回复</button>',
        '    </div>',
        '    <div class="CommentContent">路人丙说的话：五星级酒店那招是真有用。</div>',
        '    <div class="CommentItem">',
        '      <div class="CommentItem-head">',
        '        <a href="/people/yiwangtong"><img class="Avatar" src="/avatar-author.jpg" alt="一望瞳" /></a>',
        '        <a href="/people/yiwangtong">一望瞳</a>',
        '        <span>作者</span>',
        '        <button>回复</button>',
        '      </div>',
        '      <div class="CommentContent">回复 @路人丙：借势而已，别想歪。</div>',
        '    </div>',
        '  </div>',
        '  <div class="CommentItem">',
        '    <div class="CommentItem-head">',
        '      <a href="/people/lurending"><img class="Avatar" src="https://picx.zhimg.com/avatar-d.jpg" alt="路人丁" /></a>',
        '      <a href="/people/lurending">路人丁</a>',
        '      <button>回复</button>',
        '    </div>',
        '    <div class="CommentContent">路人丁说的话：最后一段太真实了。</div>',
        '  </div>',
        '</div>'
      ].join('\n');

      // 真实知乎也是这样：点开评论入口之前，评论区不在 DOM 里
      document.getElementById('openComments').addEventListener('click', (event) => {
        event.currentTarget.remove();
        document.getElementById('commentHost').innerHTML = COMMENT_HTML;
      });
    </script>

    <script>
      const params = new URLSearchParams(location.search);
      document.write(
        '<script src="' + (params.get('prepare') || '../../src/prepare-dom.js') + '"><\/script>' +
          '<script src="' + (params.get('extractors') || '../../src/extractors.js') + '"><\/script>'
      );
    </script>
    <script>
      (async () => {
        try {
          // 走真实流程：先"准备评论"（找入口 / 点开 / 等渲染），再提取
          await globalThis.WZSC_PREPARE.zhihu.comments();
          const comments = globalThis.WZSC_EXTRACTORS.extractZhihuComments({});
          document.getElementById('out').textContent = JSON.stringify({ comments: comments });
        } catch (error) {
          document.getElementById('out').textContent = JSON.stringify({ error: String((error && error.message) || error) });
        }
      })();
    </script>
  </body>
</html>
