<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
        font-size: 13px;
        color: #1f2328;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      #status { font-size: 12px; color: #57606a; margin-bottom: 10px; line-height: 1.5; }
      button {
        width: 100%;
        padding: 9px 12px;
        font-size: 14px;
        color: #fff;
        background: #1f6feb;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled { background: #8c959f; cursor: default; }
      button.secondary {
        margin-top: 8px;
        background: #fff;
        color: #1f2328;
        border: 1px solid #d0d7de;
      }
      button.secondary:hover { background: #f6f8fa; }
      #result { margin-top: 10px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
      .hint { margin-top: 10px; color: #8c959f; font-size: 11px; line-height: 1.5; }
      details { margin-top: 12px; border-top: 1px solid #eaeef2; padding-top: 10px; }
      summary { cursor: pointer; font-size: 12px; color: #57606a; }
      input, textarea {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 6px 8px;
        font-size: 12px;
        font-family: inherit;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      textarea { resize: vertical; }
      label.check { display: block; margin-top: 10px; font-size: 12px; color: #57606a; }
    </style>
  </head>
  <body>
    <h1>文章收藏助手</h1>
    <div id="status">正在连接本机服务…</div>
    <button id="save" disabled>保存这篇文章</button>
    <button id="openRepo" class="secondary" type="button">打开收藏仓库文件夹</button>

    <details>
      <summary>补录微信公众号的留言（先在微信里复制）</summary>
      <input id="pasteNumber" placeholder="文章编号，例如 478" />
      <textarea id="pasteText" rows="4" placeholder="把从微信里复制的留言粘贴到这里&#10;（格式：昵称 / 赞12 / 留言正文）"></textarea>
      <button id="pasteSave" class="secondary" type="button">写入这篇文章</button>
    </details>

    <label class="check">
      <input type="checkbox" id="debug" /> 同时保存调试页面（抓取出问题时勾选）
    </label>
    <div id="result"></div>
    <div class="hint" id="hint">
      本机服务会跟着浏览器自动启动，通常不需要管它。<br />
      如果一直提示没连接上，双击项目里的「1-一键安装.cmd」。
    </div>
    <script src="popup.js"></script>
  </body>
</html>
